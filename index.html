      return `<div class="memory-region memory-stack${added ? ' is-new' : ''}">
        <strong>Pila de ${threadName(index)}</strong>${added ? '<span class="memory-new-tag">Nueva</span>' : ''}
      </div>`;
    }).join('');
    diagram.innerHTML = `<div class="address-row">
      <div class="address-box">
        <div class="memory-region memory-kernel"><strong>Núcleo del sistema operativo</strong><span>Parte que administra el equipo</span></div>
      </div>
      <span class="address-bracket">Espacio del núcleo</span>
    </div>
    <div class="address-row address-user">
      <div class="address-box">
        <div class="memory-group">
          <h3>Pilas de P2</h3>
          ${stacks}
        </div>
        <div class="memory-group">
          <h3>Memoria que comparten los hilos de P2</h3>
          <div class="memory-region"><strong>Montón</strong><span>Espacio que el programa reserva para datos nuevos</span></div>
          <div class="memory-region"><strong>Datos</strong><span>Valores que el programa conserva al funcionar</span></div>
          <div class="memory-region"><strong>Código</strong><span>Instrucciones del programa</span></div>
        </div>
      </div>
      <span class="address-bracket">Espacio de usuario</span>
    </div>`;
    moments.innerHTML = moment('Antes', beforeCount, !after) + moment('Después', afterCount, after);
    toggle.textContent = after ? 'Reiniciar ejemplo' : 'Mostrar la pila nueva';
    toggle.classList.toggle('primary', !after);
    cue.hidden = after;
    done.hidden = !after;
    if (after) {
      describe(root, `${newThread} ya tiene su propia pila.`,
        `P2 pasa de ${beforeCount} a ${afterCount} pilas porque se agregó ${newThread}. Todos los hilos usan el código, los datos comunes y el montón del mismo proceso.`);
    } else {
      describe(root, `${newThread} es el siguiente hilo de P2.`,
        'Cada fila de pila pertenece a un hilo. Debajo aparecen el código, los datos y el montón, que todos los hilos de P2 pueden usar.');
    }
  }

  toggle.onclick = () => {
    after = !after;
    draw();
  };
  draw();
}


let selectedThreadModel = 'many';

function mountThreadModels(root) {
  const diagram = pick(root, '[data-thread-models]');
  let selection = { process: 2, index: processDiagram.active };

  function processMap(process, count, many) {
    const threads = Array.from({ length: count }, (_, index) => {
      const active = selection.process === process && selection.index === index;
      return `<div class="mapping-port">
        <button type="button" class="mapping-node" data-user-thread="${process}:${index}"
          aria-label="${threadName(index)} de P${process}" aria-pressed="${active}">${threadName(index)}</button>
        <span class="mapping-wire ${active ? 'lit' : ''}" aria-hidden="true"></span>
      </div>`;
    }).join('');
    const kernels = Array.from({ length: many ? 1 : count }, (_, index) => {
      const active = selection.process === process && (many || index === selection.index);
      return `<div class="mapping-port">
        <span class="mapping-wire ${active ? 'lit' : ''}" aria-hidden="true"></span>
        <span class="mapping-node kernel-node ${active ? 'lit' : ''}">K${process}.${index + 1}</span>
      </div>`;
    }).join('');
    return `<section class="process-envelope mapping-process" aria-label="Mapeo de P${process}" style="--nodes:${count}">
      <h3>Proceso P${process}</h3>
      <div class="mapping-layer">
        <div class="mapping-caption">Modo usuario</div>
        <div class="mapping-nodes" role="group" aria-label="Hilos de usuario de P${process}">${threads}</div>
        ${many ? '<div class="mapping-library">Librería de hilos</div>' : ''}
      </div>
      <div class="mapping-layer mapping-kernel">
        <div class="mapping-nodes" style="--nodes:${many ? 1 : count}" aria-label="Hilos que ve el planificador">${kernels}</div>
        <div class="mapping-caption">Modo núcleo · ${many ? '1 hilo planificable' : count + (count === 1 ? ' hilo planificable' : ' hilos planificables')}</div>
      </div>
    </section>`;
  }

  function draw() {
    const many = selectedThreadModel === 'many';
    const id = 'P' + selection.process + ' · ' + threadName(selection.index);
    const kernel = `K${selection.process}.${many ? 1 : selection.index + 1}`;
    setPressed(root, '[data-thread-model]', 'threadModel', selectedThreadModel);
    diagram.innerHTML = processMap(1, 2, many) + processMap(2, processDiagram.threads.length, many);
    describe(root, `${id} → ${many ? 'librería → ' : ''}${kernel}`,
      many
        ? `Los hilos del proceso usan el mismo hilo de núcleo, ${kernel}. La librería decide cuál ejecuta.`
        : `${id} tiene su propio hilo de núcleo, ${kernel}. El planificador puede darle un turno por separado.`);
  }
  useChoice(root, '[data-thread-model]', 'threadModel', mode => { selectedThreadModel = mode; draw(); });
  diagram.onclick = event => {
    const button = event.target.closest('[data-user-thread]');
    if (!button) return;
    const [process, index] = button.dataset.userThread.split(':').map(Number);
    selection = { process, index };
    draw();
    pick(diagram, '[aria-pressed="true"]')?.focus({ preventScroll: true });
  };
  draw();
}

function mountThreadSequence(root) {
  const diagram = pick(root, '[data-read-sequence]');
  const next = pick(root, '[data-sequence-next]');
  const back = pick(root, '[data-sequence-back]');
  const labels = ['H1', 'Librería', 'H2', 'Núcleo', 'Dispositivo'];
  let current = 0;

  function draw() {
    const many = selectedThreadModel === 'many';
    const scheduler = many ? 1 : 3;
    const events = [
      { from: 0, to: 0, label: 'Ejecuta H1', action: 'Ceder turno', h1: 'Ejecutando', h2: 'Preparado', cpu: 'H1',
        talk: 'H1 usa la CPU. H2 espera su turno.' },
      { from: 0, to: scheduler, label: many ? 'yield()' : 'Cede al núcleo', action: 'Dar turno a H2', h1: 'Cede el turno', h2: 'Preparado', cpu: 'Cambio de turno',
        talk: many ? 'H1 cede el turno. La librería elige el siguiente hilo.'
          : 'H1 cede el turno. El núcleo elige el siguiente hilo.' },
      { from: scheduler, to: 2, label: 'Selecciona H2', action: 'Solicitar read()', h1: 'Preparado', h2: 'Ejecutando', cpu: 'H2',
        talk: 'H2 recibe la CPU y puede iniciar la lectura.' },
      { from: 2, to: 3, label: 'read()', action: 'Iniciar lectura', h1: many ? 'Sin hilo de núcleo disponible' : 'Puede recibir CPU', h2: 'Bloqueado', cpu: many ? 'P2 no ejecuta' : 'Puede ejecutar H1',
        talk: many ? 'La lectura bloquea el único hilo de núcleo de P2. H1 también queda sin CPU.'
          : 'La lectura bloquea H2. H1 tiene su propio hilo de núcleo y puede ejecutar.' },
      { from: 3, to: 4, label: 'Inicia la E/S', action: 'Completar lectura', h1: many ? 'Sin hilo de núcleo disponible' : 'Puede recibir CPU', h2: 'Bloqueado', cpu: many ? 'P2 no ejecuta' : 'Puede ejecutar H1',
        talk: many ? 'Ningún hilo de P2 ejecuta mientras dura la lectura.'
          : 'H2 espera los datos. H1 puede usar la CPU durante esa espera.' },
      { from: 4, to: 3, label: 'Datos listos', action: 'Reanudar H2', h1: 'Puede recibir CPU', h2: 'Preparado', cpu: 'El planificador elige',
        talk: 'Llegan los datos. H2 puede volver a recibir CPU.' },
      { from: 3, to: 2, label: 'Retoma H2', h1: 'Preparado', h2: 'Ejecutando', cpu: 'H2',
        talk: many ? 'P2 vuelve a recibir CPU y H2 continúa con los datos de la lectura.'
          : 'El núcleo da un turno a H2, que continúa con los datos de la lectura.' }
    ];
    setPressed(root, '[data-read-model]', 'readModel', selectedThreadModel);
    const header = `<div class="sequence-head"><span class="small sequence-time">Tiempo ↓</span>
      ${labels.map(name => `<strong>${name}</strong>`).join('')}</div>`;
    const rows = events.map((event, index) => {
      const start = Math.min(event.from, event.to);
      const end = Math.max(event.from, event.to);
      const direction = event.from === event.to ? 'stationary' : event.from < event.to ? 'rightward' : 'leftward';
      const state = index === current ? 'current' : index < current ? 'past' : 'future';
      return `<div class="sequence-row ${state}">
        <button type="button" data-sequence-event="${index}" class="sequence-step"
          ${index === current ? 'aria-current="step"' : ''} aria-label="Paso ${index + 1}: ${event.label}">${index + 1}</button>
        ${labels.map((_, lane) => `<span class="lifeline" style="grid-column:${lane + 2}" aria-hidden="true"></span>`).join('')}
        <span class="sequence-hop ${direction}" style="grid-column:${start + 2}/${end + 3};--span:${end - start + 1}"
          title="${labels[event.from]} → ${labels[event.to]}"><b>${event.label}</b><i aria-hidden="true"></i></span>
      </div>`;
    }).join('');
    diagram.innerHTML = header + rows;
    const step = events[current];
    const waiting = current === 3 || current === 4;
    pick(root, '[data-read-states]').innerHTML = `<div class="flow-cell ${waiting && many ? 'active' : ''}"><strong>H1</strong><span>${step.h1}</span></div>
      <div class="flow-cell ${waiting ? 'active' : ''}"><strong>H2</strong><span>${step.h2}</span></div>
      <div class="flow-cell"><strong>Turno de CPU del ejemplo</strong><span>${step.cpu}</span></div>`;
    next.disabled = current === events.length - 1;
    next.textContent = step.action ?? 'Lectura completada';
    back.disabled = current === 0;
    pick(root, '[data-sequence-count]').textContent = `Paso ${current + 1} de ${events.length}`;
    setTalk(root, step.talk);
  }

  useChoice(root, '[data-read-model]', 'readModel', mode => { selectedThreadModel = mode; draw(); });
  diagram.onclick = event => {
    const button = event.target.closest('[data-sequence-event]');
    if (!button) return;
    current = Number(button.dataset.sequenceEvent);
    draw();
    pick(diagram, '[aria-current="step"]').focus({ preventScroll: true });
  };
  next.onclick = () => { if (!next.disabled) { current++; draw(); } };
  back.onclick = () => { if (current > 0) { current--; draw(); } };
  pick(root, '[data-sequence-block]').onclick = () => { current = 4; draw(); };
  pick(root, '[data-sequence-reset]').onclick = () => { current = 0; draw(); };
  draw();
}

function mountMessages(root) {
  let queue = [];
  let id = 0;
  let lastSent = '—';
  let lastRead = '—';
  const send = pick(root, '[data-send]');
  function draw(text, spoken) {
    pick(root, '[data-queue]').innerHTML = queue.length
      ? queue.map(message => chip(message, 0)).join('') : '<span class="small">Cola vacía</span>';
    pick(root, '[data-last-sent]').textContent = lastSent;
    pick(root, '[data-last-read]').textContent = lastRead;
    describe(root, text, spoken);
    send.disabled = queue.length === 3;
  }
  send.onclick = () => {
    if (queue.length >= 3) return;
    lastSent = 'M' + (++id);
    queue.push(lastSent);
    draw(`${lastSent} entra al final de la cola. Hay ${queue.length} de 3 espacios ocupados.`,
      `${lastSent} entra al final de la cola. Los mensajes anteriores salen primero.`);
  };
  pick(root, '[data-receive]').onclick = () => {
    if (!queue.length) {
      draw('La cola está vacía.', 'La recepción devuelve el control sin esperar porque es una operación sin bloqueo.');
      return;
    }
    lastRead = queue.shift();
    draw(`B retira ${lastRead}. Quedan ${queue.length} en cola.`,
      `B recibe ${lastRead}, el mensaje que entró primero.`);
  };
  pick(root, '[data-reset]').onclick = () => {
    queue = [];
    id = 0;
    lastSent = lastRead = '—';
    draw('Cola vacía.', 'La cola entrega primero el mensaje más antiguo.');
  };
  draw('Cola vacía.', 'La cola entrega primero el mensaje más antiguo.');
}

function mountSharedMap(root) {

    pick(root, '[data-b]').textContent = mappedB ? 'Vista de la región activa' : 'Sin vista de la región';

}

      <p class="note">El mutex protege toda la secuencia de lectura y escritura. A y B deben usar el mismo mutex.</p>
    </div>`,
    mount: mountRace
  },
  {
    id: 'interfaz', topic: 'api', title: 'El recorrido de una petición al sistema',
    intro: 'Una API es el conjunto de funciones con las que una aplicación pide servicios al sistema. En esta demostración, la aplicación pide abrir un archivo.',
    read: 'La petición va del programa al núcleo.',
    actions: ['Usa <strong>Siguiente paso</strong> hasta el resultado y repite con <strong>Sin permiso</strong>.'],
    board: () => `<div class="stack">
      <div class="split">
        <label class="field">Interfaz<select data-env><option value="posix">POSIX</option><option value="windows">Windows API</option></select></label>
        <label class="field">Acceso al ejemplo<select data-permission><option value="allowed">Con permiso</option><option value="denied">Sin permiso</option></select></label>
      </div>
      ${storyBoard()}
      <p class="note">Recorrido simplificado para abrir un archivo existente. La demo usa un nombre y resultados de ejemplo.</p>
    </div>`,
    mount: mountAPI
  }
);


const stage = document.getElementById('slide');
const dialog = document.getElementById('index');
const termsDialog = document.getElementById('slide-terms');
const indexTopics = document.getElementById('index-topics');
const indexSlides = document.getElementById('index-slides');
const previous = document.getElementById('previous');
const next = document.getElementById('next');
const guideToggle = document.getElementById('toggle-script');
const topicOrder = Object.keys(topics);
const exhibitionTopics = topicOrder.slice(0, 2);
const guided = deck.filter(slide => slide.exposition);
const fragmentPrefix = '#diapo-';
const requested = deck.find(slide => fragmentPrefix + slide.id === location.hash);
let current = requested ?? deck[0];
let dispose = null;

function topicTitle(id) {
  const number = topicOrder.indexOf(id) + 1;
  return 'Tema ' + String(number).padStart(2, '0') + ' · ' + topics[id].name;
}

function slidePath(slide) {
  return slide.exposition ? guided : deck.filter(item => item.topic === slide.topic && !item.exposition);
}

function updateNavigation() {
  const path = slidePath(current);
  const index = path.indexOf(current);
  const displayCount = value => String(value).padStart(2, '0');
  document.getElementById('position').textContent = displayCount(index + 1) + ' / ' + displayCount(path.length);
  document.getElementById('route-name').textContent = topicTitle(current.topic);
  document.getElementById('progress').style.setProperty('--progress', (index + 1) / path.length * 100 + '%');
  previous.disabled = index <= 0;
  next.disabled = index >= path.length - 1;
  previous.title = index > 0 ? path[index - 1].title : 'Inicio del recorrido';
  next.title = index < path.length - 1 ? path[index + 1].title : 'Fin del recorrido';
}

function showSlide(slide, moveFocus = true) {
  if (dispose) dispose();
  current = slide;
  const topic = topics[slide.topic];
  const source = topic ? `<p class="slide-source">Fuente del tema · <a href="${ull + topic.path}"
    target="_blank" rel="noopener noreferrer">Capítulo ${topic.chapter} de los apuntes de la ULL ↗</a></p>` : '';
  const instructions = slide.actions?.length ? `<section class="lesson-support lesson-choice" id="lesson-choice" aria-labelledby="lesson-choice-title">
    <h2 id="lesson-choice-title">Qué elegir</h2>
    ${slide.actions.length === 1 ? `<p>${slide.actions[0]}</p>` : `<ol>${slide.actions.map(action => `<li>${action}</li>`).join('')}</ol>`}
  </section>` : '';
  const explanation = slide.read ? `<section class="lesson-support lesson-explanation" id="lesson-explanation" aria-label="Explicación de la demostración">
    <p data-say>${slide.read}</p>
  </section>` : '';
  const termButton = termsBySlide[slide.id]
    ? '<button class="terms-button" type="button" data-open-terms aria-haspopup="dialog" aria-controls="slide-terms">Términos</button>'
    : '';
  stage.innerHTML = `<article class="slide-surface slide-enter ${slide.definition ? 'definition-slide' : ''}" aria-labelledby="slide-title">
    <header class="slide-head">
      <div class="between">
        <div class="label">${topicTitle(slide.topic)}</div>
        ${termButton}
      </div>
      <h1 id="slide-title" tabindex="-1">${slide.title}</h1>
      <p>${slide.intro}</p>
    </header>
    ${instructions}
    ${slide.exposition ? explanation : ''}
    <section class="panel ${slide.opening ? 'opening' : ''}" aria-label="${slide.definition ? 'Definición' : 'Demostración'}">${slide.board()}</section>
    ${slide.exposition ? '' : explanation}
    ${source}
  </article>`;
  guideToggle.hidden = !instructions && !explanation;
  dispose = slide.mount?.(stage) ?? null;
  updateNavigation();
  try {
    history.replaceState(null, '', fragmentPrefix + slide.id);
  } catch {
    // The presentation also works in viewers that disallow changing the address.
  }
  if (moveFocus) pick(stage, '#slide-title').focus({ preventScroll: true });
  window.scrollTo(0, 0);
}

function changeBy(delta) {
  const path = slidePath(current);
  const target = path[path.indexOf(current) + delta];
  if (target) showSlide(target);
}

function chooseIndexTopic(id) {
  const slides = deck.filter(slide => slide.topic === id);
  const lesson = slides.filter(slide => slide.exposition);
  const additional = lesson.length ? slides.filter(slide => !slide.exposition) : [];
  const links = entries => `<div class="index-links">${entries.map(slide => `<button type="button"
    class="${slide.definition ? 'primary' : ''}" data-jump="${slide.id}"
    ${current === slide ? 'aria-current="page"' : ''}>${slide.title}</button>`).join('')}</div>`;
  setPressed(indexTopics, '[data-topic]', 'topic', id);
  indexSlides.innerHTML = `<h3 id="index-topic-title">${topicTitle(id)}</h3>
    ${links(lesson.length ? lesson : slides)}
    ${additional.length ? `<details class="extra-options" ${additional.includes(current) ? 'open' : ''}>
      <summary>Más demostraciones</summary>${links(additional)}
    </details>` : ''}`;
}

function openIndex() {
  chooseIndexTopic(current.topic);
  if (dialog.open) return;
  dialog.showModal();
  dialog.scrollTop = 0;
}

function jump(id) {
  const slide = deck.find(item => item.id === id);
  if (!slide) return;
  if (dialog.open) dialog.close();
  showSlide(slide);
}

function openTerms() {
  document.getElementById('terms-slide-title').textContent = current.title;
  document.getElementById('terms-list').innerHTML = termsBySlide[current.id].map(key => {
    const [term, definition] = lessonVocabulary[key];
    return `<div><dt>${term}</dt><dd>${definition}</dd></div>`;
  }).join('');
  termsDialog.showModal();
  termsDialog.scrollTop = 0;
}

stage.addEventListener('click', event => {
  const button = event.target.closest('button');
  if (button?.hasAttribute('data-open-terms')) openTerms();
  else if (button?.dataset.jump) jump(button.dataset.jump);
});
dialog.addEventListener('click', event => {
  const button = event.target.closest('button');
  if (!button) return;
  if (button.dataset.topic) {
    chooseIndexTopic(button.dataset.topic);
  } else if (button.dataset.jump) {
    jump(button.dataset.jump);
  }
});
const indexButton = document.getElementById('open-index');
indexButton.textContent = `Temario · ${topicOrder.length}`;
indexButton.onclick = openIndex;
document.getElementById('index-title').textContent = `Temario · ${topicOrder.length} temas`;
indexTopics.innerHTML = topicOrder.map((id, i) => `<button type="button" class="index-topic" data-topic="${id}" aria-controls="index-slides">
  <span class="index-number">${String(i + 1).padStart(2, '0')}</span>
  <span>${topics[id].name}</span>
  ${exhibitionTopics.includes(id) ? '<span class="index-tag">Exposición</span>' : ''}
</button>`).join('');
guideToggle.onclick = event => {
  const hidden = document.body.classList.toggle('script-hidden');
  event.currentTarget.setAttribute('aria-pressed', String(!hidden));
};
previous.onclick = () => changeBy(-1);
next.onclick = () => changeBy(1);

const fullscreen = document.getElementById('fullscreen');
fullscreen.hidden = !document.fullscreenEnabled;
async function toggleFullscreen() {
  if (!document.fullscreenEnabled) return;
  try {
    if (document.fullscreenElement) await document.exitFullscreen();
    else await document.documentElement.requestFullscreen();
    fullscreen.removeAttribute('title');
  } catch {
    fullscreen.title = 'Puedes usar F11 para mostrar el navegador en pantalla completa.';
  }
}
fullscreen.onclick = toggleFullscreen;
document.addEventListener('fullscreenchange', () => {
  fullscreen.textContent = document.fullscreenElement ? 'Salir de pantalla completa' : 'Pantalla completa';
});
document.addEventListener('keydown', event => {
  if (dialog.open || termsDialog.open || event.ctrlKey || event.altKey || event.metaKey || event.shiftKey) return;
  if (event.target.closest('input, select, textarea, [contenteditable="true"]')) return;
  const key = event.key;
  if (key === 'ArrowRight' || key === 'PageDown' || (key === ' ' && !event.target.closest('button, a, summary'))) {
    event.preventDefault();
    changeBy(1);
  } else if (key === 'ArrowLeft' || key === 'PageUp') {
    event.preventDefault();
    changeBy(-1);
  } else if (key.toLowerCase() === 'f') {
    event.preventDefault();
    toggleFullscreen();
  }
});
showSlide(current, false);

}());
  </script>
</body>
</html>
