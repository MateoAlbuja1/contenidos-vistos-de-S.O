<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0c1521">
  <title>Hilos y planificación de la CPU · Sistemas Operativos</title>
  <style>
:root {
  color-scheme: dark;
  --page: #090f18;
  --bar: #0c1521;
  --slide: #162233;
  --panel: #111d2c;
  --surface: #162638;
  --border: #2b4054;
  --text: #f1f6fd;
  --muted: #b9c9d9;
  --accent: #78dbff;
  --accent-button: #48b9e6;
  --accent-surface: #16364b;
  --text-on-accent: #061625;

  --body: "Segoe UI", system-ui, sans-serif;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { scrollbar-color: #435c76 #0b131e; }
body {
  margin: 0;
  min-width: 300px;
  min-height: 100dvh;
  background: radial-gradient(ellipse at 50% 4%, #132236, transparent 65%), var(--page);
  color: var(--text);
  font: 16px/1.5 var(--body);
  padding-bottom: 74px;
}
button, input, select { font: inherit; color: inherit; }
button {
  border: 1px solid var(--border);
  border-radius: 8px;
  background: #1a2a3e;
  padding: 8px 13px;
  font-weight: 640;
  font-size: .89rem;
  cursor: pointer;
  line-height: 1.27;
  min-height: 38px;
}
button:hover:not(:disabled) { border-color: #5383a5; background: #203b53; }
button:disabled { opacity: .45; cursor: default; }
button[aria-pressed="true"] { background: var(--accent-surface); border-color: #4299c0; color: #d4f5ff; }
button.primary { background: var(--accent-button); border-color: #6acfff; color: var(--text-on-accent); font-weight: 750; }
button.primary:hover:not(:disabled) { background: #77d7ff; }
button.large { font-size: .96rem; min-height: 44px; padding: 10px 16px; }
:focus-visible { outline: 2px solid #aceaff; outline-offset: 3px; }
a { color: var(--accent); text-underline-offset: 3px; }
p { margin: 0; }
h2, h3, ol, ul { margin-top: 0; }
h3 { font-size: 1rem; margin-bottom: 6px; }
small, .small { font-size: .848rem; color: var(--muted); }
code, .mono { font-family: var(--mono); }
code { overflow-wrap: anywhere; }
pre { white-space: pre-wrap; margin: 0; }
.frame { width: min(100% - 48px, 1240px); margin-inline: auto; }
.bar-top { position: sticky; top: 0; z-index: 5; background: var(--bar); border-bottom: 1px solid var(--border); }
.bar-inner { display: flex; min-height: 54px; align-items: center; justify-content: space-between; gap: 13px; }
.brand { display: flex; gap: 10px; align-items: center; font-weight: 740; letter-spacing: -.014em; }
.brand-icon {
  display: grid;
  place-items: center;
  width: 33px;
  height: 33px;
  border-radius: 8px;
  border: 1px solid #365774;
  background: #192f43;
  color: var(--accent);
  font: 750 .85rem var(--mono);
}
.label { font-size: .75rem; letter-spacing: .1em; text-transform: uppercase; font-weight: 750; color: var(--accent); }
.terms-button { min-height: 32px; padding: 4px 11px; color: #c9edff; }
.top-actions, .actions { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.top-actions button { white-space: nowrap; min-height: 34px; font-size: .82rem; }
.stage {
  min-height: calc(100dvh - 132px);
  padding-block: 23px 17px;
  display: grid;
  align-items: center;
}
.slide-surface {
  min-width: 0;
  padding: clamp(17px, 2.8vw, 34px);
  border-radius: 15px;
  border: 1px solid var(--border);
  background: linear-gradient(150deg, #172638, #131e2d 66%);
  box-shadow: 0 18px 47px #0006;
}
.slide-head { margin-bottom: 17px; }
.slide-head h1 {
  font: 745 clamp(1.95rem, 3.8vw, 3.15rem)/1.12 var(--body);
  letter-spacing: -.034em;
  margin: 5px 0 10px;
  max-width: 1100px;
  text-wrap: balance;
}
.slide-head p { font-size: clamp(.97rem, 1.25vw, 1.11rem); max-width: 970px; color: var(--muted); }
.panel { border: 1px solid var(--border); border-radius: 11px; background: var(--panel); padding: clamp(13px, 1.8vw, 22px); }
.panel.opening { background: transparent; border: 0; padding: 0; }
.panel > :first-child { margin-top: 0; }
.panel > :last-child { margin-bottom: 0; }
.stack { display: grid; gap: 13px; }
.stack-sm { display: grid; gap: 8px; }
.split { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
.tri { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 9px; }
.strip { display: flex; flex-wrap: wrap; gap: 7px; align-items: center; }
.between { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 8px; }
.script-hidden .lesson-support { display: none; }
.lesson-choice {
  display: grid;
  grid-template-columns: 100px minmax(0, 1fr);
  gap: 4px 13px;
  padding: 10px 13px;
  border-block: 1px solid var(--border);
  background: #132437;
  margin-bottom: 12px;
}
.lesson-support h2 { font-size: .9rem; color: var(--accent); margin: 0; }
.lesson-choice p, .lesson-choice ol { margin: 0; color: #d7e5f4; font-size: .92rem; }
.lesson-choice ol { padding-left: 1.07rem; }
.lesson-choice li + li { margin-top: 3px; }
.lesson-choice li::marker { color: var(--accent); font-weight: 750; }
.lesson-explanation {
  padding: 12px 16px;
  background: #122d3c;
  border-left: 4px solid var(--accent-button);
  border-radius: 4px 8px 8px 4px;
  margin-top: 13px;
}
.lesson-explanation p { margin-top: 4px; font-size: clamp(.97rem, 1.32vw, 1.12rem); line-height: 1.5; }
.lesson-explanation + .panel { margin-top: 12px; }
.definition-slide .slide-head p { color: #e6f5ff; font-size: clamp(1.1rem, 2vw, 1.41rem); }
.definition-card { border-top: 3px solid #4aa6cd; }
.definition-card h2 { color: #bcefff; font-size: 1.1rem; margin-bottom: 6px; }
.definition-card p { font-size: 1rem; }
.definition-example { background: #142d40; padding: 11px 14px; border-radius: 7px; }
.extra-options { padding: 7px 10px; border: 1px solid var(--border); border-radius: 7px; background: #101f2f; }
.extra-options summary { cursor: pointer; color: #bedaee; font-size: .86rem; font-weight: 650; }
.extra-options[open] > :not(summary) { margin-top: 9px; }
.slide-source { color: var(--muted); margin-top: 12px; font-size: .79rem; }
.box, .status, .note { border-radius: 9px; padding: 11px 13px; background: var(--surface); border: 1px solid var(--border); }
.box p { font-size: .92rem; }
.box h3 { margin: 0 0 4px; }
.status { background: #112d3d; border-color: #28526b; font-size: .93rem; color: #e1f6ff; }
.note { font-size: .86rem; color: var(--muted); }
.flow { display: grid; grid-template-columns: repeat(var(--cols, 3), minmax(0, 1fr)); gap: 8px; }
.flow-cell { background: #142236; border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px; min-width: 0; }
.flow-cell.active { background: var(--accent-surface); border-color: #3f91ad; box-shadow: inset 0 -2px #4cb4d8; }
.flow-cell strong { display: block; }
.flow-cell > span { display: block; color: var(--muted); font-size: .85rem; overflow-wrap: anywhere; }
.flow-cell .strip { margin-top: 5px; }
.chip { display: inline-flex; align-items: center; justify-content: center; border-radius: 6px; font-weight: 750; padding: 4px 8px; }
.tone-0 { background: #47bce9; color: #061b2b; }
.tone-1 { background: #eac56d; color: #271d14; }
.tone-2 { background: #61c8a7; color: #09261e; }
.tone-3 { background: #ce91d7; color: #25112b; }
.tone-4 { background: #97a9ff; color: #182042; }
.tone-5 { background: #eda284; color: #341b15; }
.tone-6 { background: #acc1d7; color: #17253a; }
.tone-7 { background: #e494bc; color: #302132; }
.entity-choice { display: inline-flex; align-items: center; gap: 7px; white-space: nowrap; }
.entity-key { width: 10px; height: 10px; border-radius: 3px; flex: none; }
.entity-choice[aria-pressed="true"] { box-shadow: inset 0 -2px #4197b7; }
.diagram-pair { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.process-envelope {
  align-content: start;
  display: grid;
  gap: 9px;
  padding: 12px;
  min-width: 0;
  border: 1px solid #5185a9;
  border-radius: 8px;
  background: repeating-linear-gradient(138deg, #6e9bb314 0 1px, transparent 1px 8px), #0d1b29;
}
.process-envelope h3 { color: #a9e5ff; margin: 0; }
.process-resources { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; }
.process-part { padding: 5px 7px; min-height: 32px; background: #102235; border-color: #3d6889; }
.process-part-reference { display: grid; place-items: center; padding: 5px 7px; min-height: 32px; border: 1px solid #3d6889; border-radius: 8px; font-size: .89rem; background: #102235; }
.thread-envelopes { display: grid; gap: 6px; }
.thread-envelopes.many { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.thread-envelope {
  display: grid;
  gap: 6px;
  background: #142234;
  padding: 7px 8px;
  border: 1px solid #8e716d;
  border-radius: 6px;
}
.thread-envelope.thread-observed { border-color: #eda284; box-shadow: inset 0 0 0 1px #eda28440; }
.thread-envelope strong { font-size: .86rem; color: #ffd1bc; }
.thread-parts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px; }
.memory-lab {
  display: grid;
  grid-template-columns: minmax(0, 1.5fr) minmax(0, 1fr);
  grid-template-areas: "map controls";
  gap: 15px;
  align-items: start;
}
.memory-map { grid-area: map; }
.memory-controls { grid-area: controls; }
.memory-controls .lesson-explanation { margin-top: 0; }
.memory-controls .lesson-explanation p { margin-top: 0; }
.memory-moments { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.memory-moment { display: grid; gap: 2px; padding: 8px 10px; border: 1px solid var(--border); border-radius: 7px; }
.memory-moment[aria-current="step"] { background: var(--accent-surface); border-color: #58acd1; }
.memory-moment > span { font-size: .8rem; color: var(--muted); }
.memory-moment > strong { font-size: .98rem; }
.address-row { display: grid; grid-template-columns: minmax(0, 1fr) 96px; gap: 8px; }
.address-box { padding: 4px; display: grid; gap: 3px; border: 1px solid #5986a9; background: #0b1624; }
.address-row:first-child .address-box { border-radius: 7px 7px 0 0; }
.address-user .address-box { border-radius: 0 0 7px 7px; border-top: 0; }
.address-bracket {
  display: flex;
  align-items: center;
  padding-left: 10px;
  border-left: 1px solid #76acd0;
  background: linear-gradient(#76acd0, #76acd0) left top / 6px 1px no-repeat, linear-gradient(#76acd0, #76acd0) left bottom / 6px 1px no-repeat;
  color: #b0d6ee;
  font-size: .81rem;
}
.memory-region {
  background: #192a3d;
  border: 1px solid var(--border);
  display: flex;
  justify-content: space-between;
  align-items: center;
  min-width: 0;
  text-align: left;
  gap: 5px 10px;
  flex-wrap: wrap;
  font-size: .86rem;
  border-radius: 4px;
  min-height: 28px;
  padding: 3px 8px;
}
.memory-region > span { font-size: .74rem; color: #bfd6e9; }
.memory-kernel { min-height: 34px; background: #253948; }
.memory-group { display: grid; gap: 3px; }
.memory-group + .memory-group { margin-top: 4px; }
.memory-group h3 { margin: 2px 7px; color: var(--muted); font-size: .82rem; }
.memory-stack { border-color: #816f68; }
.memory-stack.is-new { border-color: #6acfff; background: var(--accent-surface); color: #e9f8ff; }
.memory-region .memory-new-tag {
  padding: 0 6px;
  border-radius: 4px;
  background: var(--accent-button);
  color: var(--text-on-accent);
  font-weight: 750;
}
.mapping-process { gap: 0; }
.mapping-process h3 { margin-bottom: 7px; }
.mapping-layer { padding-inline: 4px; }
.mapping-nodes { display: grid; grid-template-columns: repeat(var(--nodes), minmax(0, 1fr)); gap: 3px; }
.mapping-port { display: flex; align-items: center; flex-direction: column; min-width: 0; }
.mapping-node {
  display: grid;
  place-items: center;
  width: min(49px, 100%);
  min-height: 35px;
  border: 1px solid #668cae;
  border-radius: 50%;
  font: 720 .83rem var(--mono);
  padding: 4px;
  background: #112338;
}
.mapping-wire { height: 15px; width: 1px; background: #6c94af; }
.mapping-wire.lit { background: var(--accent); box-shadow: 0 0 4px #75dbff9c; }
.mapping-library { text-align: center; color: #ddf3ff; border: 1px solid #5f8daa; background: #1b3b51; font-size: .76rem; }
.mapping-kernel { border-top: 1px dashed #7b9db7; background: #1c2b3480; border-radius: 0 0 5px 5px; }
.mapping-kernel .lit.kernel-node { background: #163f56; border-color: var(--accent); }
.mapping-caption { color: #b8d9ef; font-size: .77rem; padding-block: 4px; }
.sequence-scroll { min-width: 0; overflow-x: auto; border: 1px solid #345269; border-radius: 8px; background: #0a1624; }
.sequence-chart { min-width: 590px; }
.sequence-head, .sequence-row { display: grid; grid-template-columns: 58px repeat(5, minmax(0, 1fr)); align-items: stretch; }
.sequence-head { background: #15293c; border-bottom: 1px solid #315169; }
.sequence-head strong { text-align: center; padding: 8px 2px; font-size: .85rem; }
.sequence-time { align-self: center; padding-left: 6px; font-size: .7rem; white-space: nowrap; }
.sequence-row { min-height: 43px; border-bottom: 1px solid #223246; }
.sequence-row:last-child { border-bottom: 0; }
.sequence-row.current { background: #15364b; }
.sequence-step { grid-area: 1/1; align-self: center; justify-self: center; min-width: 29px; padding: 3px; min-height: 27px; font-size: .8rem; }
.sequence-step[aria-current="step"] { background: var(--accent-button); border-color: #a8e6ff; color: var(--text-on-accent); }
.lifeline { grid-row: 1; justify-self: center; width: 1px; border-left: 1px dashed #6d8ba5; }
.sequence-hop {
  grid-row: 1;
  z-index: 1;
  align-self: center;
  position: relative;
  min-width: 0;
  margin-inline: calc(50% / var(--span));
  color: #beddf2;
  display: grid;
  gap: 4px;
  text-align: center;
}
.sequence-hop b { font: 650 .78rem var(--mono); }
.sequence-hop i { position: relative; align-self: center; height: 1px; background: currentColor; }
.sequence-hop i::after { position: absolute; content: ''; right: 0; top: -3px; width: 6px; height: 6px; border-right: 1px solid currentColor; border-top: 1px solid currentColor; transform: rotate(45deg); }
.sequence-hop.leftward i::after { left: 0; right: auto; transform: rotate(225deg); }
.sequence-hop.stationary { margin-inline: 0; justify-self: center; background: #16283c; border: 1px solid #638ba9; border-radius: 5px; padding: 3px 6px; }
.sequence-hop.stationary i { display: none; }
.sequence-row.current .sequence-hop { color: #b6f0ff; }
.sequence-row.future .sequence-hop { color: #8ca3b9; }
.editor-viz { display: grid; grid-template-columns: minmax(0, 1.65fr) minmax(215px, 1fr); gap: 11px; align-items: stretch; }
.editor-window { background: #0b1724; border: 1px solid #345269; border-radius: 9px; overflow: hidden; }
.editor-titlebar { padding: 9px 14px; background: #172c40; border-bottom: 1px solid #345269; }
.editor-titlebar strong { font-family: var(--mono); font-size: .92rem; }
.editor-sheet { min-height: 133px; margin: 0; padding: 15px 18px 15px 42px; font-family: var(--mono); font-size: .99rem; color: #e9f6ff; }
.editor-sheet li + li { margin-top: 7px; }
.editor-sheet li::marker { color: #83aac6; font-size: .86em; }
.editor-flag { color: #fff2ce; background: #785027; border-radius: 3px; padding: 0 2px; text-decoration: underline wavy #ffb871; }
.editor-controls { display: grid; align-content: start; gap: 8px; }
.editor-controls button { text-align: left; }
.editor-controls h3 { margin-bottom: 0; }
.state-route { display: grid; grid-template-columns: repeat(var(--state-count), minmax(0, 1fr)); gap: 7px; }
.state-node { position: relative; background: #132235; border: 1px solid var(--border); border-radius: 8px; padding: 9px; min-width: 0; }
.state-node b { display: block; font-size: .87rem; }
.state-node small { font: 650 .7rem var(--mono); }
.state-node[aria-current="step"] { background: #1a4156; color: #e7fbff; border-color: #60c2eb; }
.state-node[aria-current="step"] small { color: var(--accent); }
.state-node.reached { border-color: #38617a; }
.state-detail h3 { color: var(--accent); }
.state-detail .tri { margin-block: 9px; }
.state-detail .flow-cell { padding: 7px 10px; }
.state-detail .status { margin-top: 0; }
.idle { background: repeating-linear-gradient(135deg,#33475a 0 6px,#293b4b 6px 9px); color: #ecf6ff; }
.switch { background: repeating-linear-gradient(135deg,#d5af63 0 7px,#efcb7a 7px 12px); color: #281e13; }
.metric { border-radius: 8px; border: 1px solid var(--border); background: #142638; padding: 9px 11px; min-width: 0; }
.metric strong { display: block; font: 750 clamp(1.13rem, 2.25vw, 1.76rem)/1.14 var(--body); color: var(--accent); overflow-wrap: anywhere; }
.metric span { display: block; font-size: .8rem; color: var(--muted); margin-top: 4px; }
.grid-stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(105px, 1fr)); gap: 8px; }
.time-scroll, .table-scroll { overflow-x: auto; min-width: 0; }
.time-plot { width: 100%; padding: 2px 11px 0; min-width: var(--min-chart, 280px); }
.track { height: 42px; position: relative; border-radius: 6px; background: #0c1521; overflow: hidden; border: 1px solid #273e52; }
.track.compact { height: 35px; }
.segment {
  display: flex;
  justify-content: center;
  align-items: center;
  position: absolute;
  height: 100%;
  border-right: 1px solid #08112060;
  font: 750 .83rem var(--body);
  overflow: hidden;
  white-space: nowrap;
}
.segment.active-segment { outline: 3px solid #f2fbff; outline-offset: -3px; z-index: 1; }
.dimmed-segment { opacity: .45; }
.focused-segment { outline: 2px solid #d3f4ff; outline-offset: -2px; z-index: 1; }
.time-axis { position: relative; height: 24px; margin-top: 3px; color: var(--muted); }
.time-axis span { position: absolute; top: 0; transform: translateX(-50%); font: .76rem var(--mono); }
table { border-collapse: collapse; width: 100%; font-size: .86rem; font-variant-numeric: tabular-nums; }
caption { text-align: left; color: var(--muted); font-weight: 650; padding-bottom: 6px; }
th, td { padding: 6px 8px; border-bottom: 1px solid #273c50; text-align: right; }
th:first-child, td:first-child { text-align: left; }
th { background: #182d42; font-weight: 700; white-space: nowrap; }
tr.focus-row td { background: #173950; }
label.field { display: grid; gap: 4px; font-size: .86rem; font-weight: 650; min-width: 0; }
select, input[type="number"], input[type="text"] {
  border: 1px solid #37526d;
  background: #0d1928;
  border-radius: 7px;
  padding: 6px 7px;
  min-height: 36px;
  width: 100%;
}
input[type="number"] { min-width: 54px; }
table input[type="number"] { max-width: 76px; }
.table-action { padding: 3px 8px; min-height: 32px; }
.lab-settings { display: grid; grid-template-columns: 1.4fr 1fr .9fr; gap: 8px; }
.lab-layout { display: grid; gap: 16px; align-items: start; }
.lab-layout > * { min-width: 0; }
.inspector { border-left: 3px solid #479bc3; }
.inspector h3, .compare-results h3 { margin: 0; }
.inspector progress { width: 100%; height: 10px; accent-color: var(--accent-button); }
.inspector .dials { display: grid; grid-template-columns: repeat(auto-fit, minmax(92px, 1fr)); gap: 6px; }
.inspector .metric strong { font-size: 1.22rem; }
.lab-form .entity-choice { min-height: 32px; padding: 4px 7px; }
.lab-form th, .lab-form td { padding-inline: 5px; }
.workload { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: 4px; }
.workload span { display: grid; place-items: center; min-height: 26px; border-radius: 5px; font-size: .77rem; font-weight: 750; }
.workload .focused-unit { outline: 2px solid #e8faff; outline-offset: -2px; }
.workload .dimmed-unit { opacity: .52; }
.core-focus { outline: 2px solid var(--accent); outline-offset: -2px; }
.pending { background: #22364b; color: #d3e3f0; }
.compare-bars { display: grid; gap: 6px; }
.measure { display: grid; grid-template-columns: minmax(80px, 132px) minmax(0, 1fr) 75px; gap: 9px; align-items: center; font-size: .85rem; }
.measure-track { height: 14px; border-radius: 4px; overflow: hidden; background: #24374c; }
.measure-track i { display: block; height: 100%; }
.measure strong { text-align: right; }
.inline-code { background: #0b1724; color: #ddf3ff; padding: 11px 13px; border-radius: 8px; font-size: .9rem; border: 1px solid var(--border); }
.bar-bottom { position: fixed; inset: auto 0 0; z-index: 6; background: var(--bar); border-top: 1px solid var(--border); }

<body>
  <header class="bar-top">
    <div class="frame bar-inner">
      <div class="brand"><span class="brand-icon" aria-hidden="true">SO</span><span class="brand-name">Sistemas Operativos</span></div>
      <div class="top-actions">
        <button id="open-index" type="button">Temario</button>
        <button id="toggle-script" type="button" aria-controls="lesson-choice lesson-explanation" aria-pressed="true">Indicaciones</button>
        <button id="fullscreen" type="button">Pantalla completa</button>
      </div>
    </div>
  </header>

  <main id="slide" class="frame stage"></main>

  <footer class="bar-bottom">
    <div class="frame bar-inner">
      <div class="position">
        <span class="small" id="route-name"></span>
        <output id="position" aria-label="Diapositiva actual"></output>
        <div class="progress-track" aria-hidden="true"><div class="progress-fill" id="progress"></div></div>
      </div>
      <span class="keyboard-hint">← → o Espacio para avanzar</span>
      <nav class="nav-buttons" aria-label="Diapositivas">
        <button type="button" id="previous">← Anterior</button>
        <button type="button" class="primary" id="next">Siguiente →</button>
      </nav>
    </div>
  </footer>

  <dialog id="index" aria-labelledby="index-title">
    <div class="between">
      <h2 id="index-title">Temario</h2>
      <form method="dialog"><button type="submit">Cerrar</button></form>
    </div>
    <p class="small index-hint">Elige un tema y luego una diapositiva.</p>
    <div class="index-topics" id="index-topics" role="group" aria-label="Todos los temas"></div>
    <section class="index-group" id="index-slides" aria-labelledby="index-topic-title"></section>
  </dialog>

  <dialog id="slide-terms" aria-labelledby="terms-title" aria-describedby="terms-slide-title">
    <div class="between">
      <h2 id="terms-title">Términos</h2>
      <form method="dialog"><button type="submit" autofocus>Cerrar</button></form>
    </div>
    <p class="small index-hint" id="terms-slide-title"></p>
    <dl class="terms-list" id="terms-list"></dl>
  </dialog>

  <script>
(function () {
'use strict';
const pick = (root, selector) => root.querySelector(selector);
const picks = (root, selector) => Array.from(root.querySelectorAll(selector));
const numberES = new Intl.NumberFormat('es-EC', { maximumFractionDigits: 2 });
const fmt = value => numberES.format(value);
const ms = value => `${fmt(value)} ms`;
const chip = (label, tone) => `<span class="chip tone-${tone}">${label}</span>`;
const metric = (value, label) => `<div class="metric"><strong>${value}</strong><span>${label}</span></div>`;

function entityButton(id, tone, selected, attribute = 'data-entity') {
  return `<button class="entity-choice" type="button" ${attribute}="${id}" aria-pressed="${selected}">
    <span class="entity-key tone-${tone}" aria-hidden="true"></span>${id}
  </button>`;
}

function setTalk(root, spoken) {
  pick(root, '[data-say]').textContent = spoken;
}

function describe(root, detail, spoken = detail) {
  pick(root, '[data-status]').textContent = detail;
  setTalk(root, spoken);
}

const baseJobs = [
  { id: 'P1', arrival: 0, burst: 8, priority: 3 },
  { id: 'P2', arrival: 1, burst: 4, priority: 1 },
  { id: 'P3', arrival: 2, burst: 2, priority: 2 }
];
const reversedJobs = [
  { id: 'P1', arrival: 2, burst: 8, priority: 3 },
  { id: 'P2', arrival: 0, burst: 4, priority: 1 },
  { id: 'P3', arrival: 1, burst: 2, priority: 2 }
];
const idleJobs = [
  { id: 'P1', arrival: 2, burst: 3, priority: 3 },
  { id: 'P2', arrival: 7, burst: 3, priority: 1 },
  { id: 'P3', arrival: 8, burst: 2, priority: 2 }
];

const policies = {
  fcfs: 'FCFS',
  sjf: 'SJF',
  srtf: 'SRTF',
  rr: 'Round Robin',
  priority: 'Prioridad sin expropiar',
  priorityP: 'Prioridad expropiativa'
};
const policyOptions = Object.entries(policies)
  .map(([value, name]) => `<option value="${value}">${name}</option>`).join('');
const cloneJobs = jobs => jobs.map(job => ({ ...job }));

function schedule(workload, policy, quantum = 2, switchCost = 0) {
  const jobs = workload.map((job, order) => ({
    ...job, order, remaining: job.burst, first: null, finish: null
  }));
  const byArrival = (a, b) => a.arrival - b.arrival || a.order - b.order;
  const arrivals = [...jobs].sort(byArrival);
  const rr = policy === 'rr';
  const preemptive = policy === 'srtf' || policy === 'priorityP';
  const queue = [];
  const segments = [];
  let time = 0;
  let arrivalIndex = 0;
  let finished = 0;
  let sliceLeft = 0;
  let running = null;
  let previous = null;
  let sliceNumber = 0;
  let switches = 0;

  function enqueueArrivals() {
    while (arrivalIndex < arrivals.length && arrivals[arrivalIndex].arrival <= time) {
      queue.push(arrivals[arrivalIndex++]);
    }
  }

  function append(kind, start, end, job = null) {
    const last = segments.at(-1);
    const id = job?.id ?? null;
    const label = job ? job.id : kind === 'idle' ? 'Libre' : 'Cambio';
    if (last?.kind === kind && last.id === id && last.slice === sliceNumber && last.end === start) {
      last.end = end;
    } else {
      segments.push({ kind, id, start, end, label, tone: job?.order ?? 0, slice: sliceNumber });
    }
  }

  function prefer(a, b) {
    let difference = 0;
    if (policy === 'sjf') difference = a.burst - b.burst;
    if (policy === 'srtf') difference = a.remaining - b.remaining;
    if (policy === 'priority' || policy === 'priorityP') difference = a.priority - b.priority;
    if (difference !== 0) return difference;
    if (a === running) return -1;
    if (b === running) return 1;
    return byArrival(a, b);
  }

  while (finished < jobs.length) {
    let candidate = running;
    if (rr) {
      enqueueArrivals();
      if (running && sliceLeft === 0) {
        queue.push(running);
        running = null;
      }
      candidate = running ?? queue.shift();
    } else if (!running || preemptive) {
      const ready = jobs.filter(job => job.arrival <= time && job.remaining > 0);
      candidate = ready.sort(prefer)[0];
    }

    if (!candidate) {
      const nextArrival = jobs.find(job => job.arrival > time);
      const resume = nextArrival ? Math.min(...jobs.filter(job => job.arrival > time).map(job => job.arrival)) : time;
      if (resume <= time) throw new Error('La planificación no pudo avanzar.');
      append('idle', time, resume);
      time = resume;
      previous = running = null;
      continue;
    }

    if (candidate !== running) {
      sliceNumber++;
      sliceLeft = quantum;
    }
    if (previous && previous !== candidate) {
      switches++;
      if (switchCost) {
        append('switch', time, time + switchCost);
        time += switchCost;
      }
    }

    running = candidate;
    previous = candidate;
    running.first ??= time;
    append('work', time, time + 1, running);
    time++;
    sliceLeft--;
    running.remaining--;
    if (running.remaining === 0) {
      running.finish = time;
      running = null;
      finished++;
    }
  }

  const rows = jobs.map(job => ({
    ...job,
    turn: job.finish - job.arrival,
    wait: job.finish - job.arrival - job.burst,
    response: job.first - job.arrival
  }));
  const avg = key => rows.reduce((sum, job) => sum + job[key], 0) / rows.length;
  const busy = jobs.reduce((sum, job) => sum + job.burst, 0);
  return {
    end: time, segments, rows, switches,
    wait: avg('wait'), turn: avg('turn'), response: avg('response'),
    utilization: 100 * busy / time, throughput: rows.length / time
  };
}

function timeline(segments, end, options = {}) {
  const { compact = false, active = -1, units = 'ms', name = 'Línea de tiempo', focusId = null } = options;
  const block = (segment, i) => {
    const css = segment.kind === 'work' ? `tone-${segment.tone}` : segment.kind;
    const details = `${segment.label}, de ${segment.start} a ${segment.end} ${units}`;
    const width = 100 * (segment.end - segment.start) / end;
    const highlight = focusId && segment.kind === 'work'
      ? segment.id === focusId ? 'focused-segment' : 'dimmed-segment' : '';
    return `<span class="segment ${css} ${highlight} ${i === active ? 'active-segment' : ''}"
      style="left:${100 * segment.start / end}%;width:${width}%"
      title="${details}">${width >= 3 || end < 34 ? segment.label : ''}</span>`;
  };
  const tickStep = end <= 12 ? 1 : end <= 24 ? 2 : Math.ceil(end / 10);
  const ticks = [0];
  for (let t = tickStep; t <= end - Math.ceil(tickStep / 2); t += tickStep) ticks.push(t);
  ticks.push(end);
  return `<div class="time-scroll"><div class="time-plot" style="--min-chart:${Math.max(280, end * 10)}px">
    <div role="img" aria-label="${name}${focusId ? ', con ' + focusId + ' destacado' : ''}, ${segments.length ? segments.map(s => `${s.label} de ${s.start} a ${s.end}`).join(', ') : 'sin tramos mostrados'}"
      class="track ${compact ? 'compact' : ''}">${segments.map(block).join('')}</div>
    <div aria-hidden="true" class="time-axis">${ticks.map(t => `<span style="left:${100 * t / end}%">${t}</span>`).join('')}</div>
  </div></div>`;
}

function workSegments(ids) {
  return ids.map((id, i) => ({
    id, label: id, kind: 'work', start: i, end: i + 1,
    tone: Number(id.slice(-1)) - 1
  }));
}

function setPressed(root, selector, key, value) {
  picks(root, selector).forEach(button => {
    button.setAttribute('aria-pressed', String(button.dataset[key] === String(value)));
  });
}

function useChoice(root, selector, key, onChoose) {
  picks(root, selector).forEach(button => {
    button.addEventListener('click', () => onChoose(button.dataset[key]));
  });
}

function stepStory(root, scenes, render, speak) {
  let index = 0;
  const next = pick(root, '[data-step]');
  const back = pick(root, '[data-back]');
  const restart = pick(root, '[data-reset]');
  const container = pick(root, '[data-scene]');
  function draw() {
    container.innerHTML = render(scenes[index], index);
    if (speak) setTalk(root, speak(scenes[index], index));
    next.disabled = index >= scenes.length - 1;
    next.textContent = next.disabled ? 'Recorrido completo' : scenes[index].action ?? 'Siguiente paso';
    if (back) back.disabled = index === 0;
    pick(root, '[data-scene-count]').textContent = `Paso ${index + 1} de ${scenes.length}`;
  }
  next.onclick = () => { index = Math.min(index + 1, scenes.length - 1); draw(); };
  restart.onclick = () => { index = 0; draw(); };
  if (back) back.onclick = () => { index = Math.max(index - 1, 0); draw(); };
  draw();
}

function storyBoard({ showPrevious = true } = {}) {
  return `<div class="stack">
    <div data-scene aria-live="polite"></div>
    <div class="between">
      <div class="actions">
        <button type="button" data-step class="primary">Siguiente paso</button>
        ${showPrevious ? '<button type="button" data-back>Paso anterior</button>' : ''}
        <button type="button" data-reset>Reiniciar recorrido</button>
      </div>
      <span class="small" data-scene-count></span>
    </div>
  </div>`;
}


function mountDispatch(root) {
  const tokens = value => value.startsWith('P')
    ? value.split(' → ').map(id => chip(id, id === 'P1' ? 0 : 1)).join(' ')
    : value;
  function choose(first) {
    const other = first === 'P1' ? 'P2' : 'P1';
    setPressed(root, '[data-first]', 'first', first);
    const events = [
      { ready: first + ' → ' + other, cpu: 'Libre', waiting: 'Ninguno', action: 'Asignar CPU', why: `${first} está primero en la cola.`, talk: 'Los procesos preparados ya tienen trabajo y solo esperan un turno.' },
      { ready: other, cpu: first, waiting: 'Ninguno', action: 'Pedir lectura', why: `${first} toma la CPU. ${other} queda preparado.`, talk: `${first} recibe el turno porque está primero. ${other} espera en la cola.` },
      { ready: 'Vacía', cpu: other, waiting: first, action: 'Completar lectura', why: `${first} queda bloqueado. ${other} toma la CPU.`, talk: `${first} está bloqueado porque espera los datos del archivo. Mientras tanto, ${other} usa el procesador.` },
      { ready: first, cpu: other, waiting: 'Ninguno', action: 'Ceder CPU', why: `Llegaron los datos de ${first}.`, talk: `Ya llegaron los datos. ${first} vuelve a la lista de preparados y puede trabajar cuando reciba otro turno.` },
      { ready: 'Vacía', cpu: first, waiting: 'Ninguno', why: `${other} cede la CPU.`, talk: `${other} deja libre el procesador. ${first} lo recibe y continúa desde donde se detuvo.` }
    ];
    stepStory(root, events, event => `<div class="stack">
      <div class="flow" aria-label="Estados de los procesos">
        <div class="flow-cell ${event.ready === 'Vacía' ? '' : 'active'}"><strong>Preparados</strong><div class="strip">${tokens(event.ready)}</div></div>
        <div class="flow-cell ${event.cpu === 'Libre' ? '' : 'active'}"><strong>En CPU</strong><div class="strip">${tokens(event.cpu)}</div></div>
        <div class="flow-cell ${event.waiting === 'Ninguno' ? '' : 'active'}"><strong>Bloqueados por E/S</strong><div class="strip">${tokens(event.waiting)}</div></div>
      </div>
      <p class="status">${event.why}</p>
    </div>`, event => event.talk);
  }
  useChoice(root, '[data-first]', 'first', choose);
  choose('P1');
}

function mountPreemption(root) {
  const jobs = [
    { id: 'P1', arrival: 0, burst: 6, priority: 2 },
    { id: 'P2', arrival: 2, burst: 2, priority: 1 }
  ];
  function draw(choice) {
    const result = schedule(jobs, choice);
    setPressed(root, '[data-policy]', 'policy', choice);
    pick(root, '[data-demo]').innerHTML = timeline(result.segments, result.end, { name: 'Ejecución de P1 y P2' });
    pick(root, '[data-stats]').innerHTML = metric(ms(result.rows[1].first), 'Empieza P2')
      + metric(ms(result.rows[1].response), 'Respuesta de P2');
    describe(root, choice === 'srtf'
      ? 'En t = 2, P2 toma la CPU. A P1 le faltan 4 ms. P2 necesita 2 ms.'
      : 'En t = 2, P2 entra a la cola. Empieza en t = 6, cuando P1 libera la CPU.',
      choice === 'srtf'
        ? 'P2 necesita 2 ms y a P1 le quedan 4 ms. La regla permite interrumpir a P1 y darle el turno a P2.'
        : 'P2 llega en el instante 2 y empieza en el 6. Espera 4 ms mientras termina P1.');
  }
  useChoice(root, '[data-policy]', 'policy', draw);
  draw('fcfs');
}

function mountMetrics(root) {
  const result = schedule(baseJobs, 'fcfs');
  let selectedId = 'P2';
  let displayedMetric = 'wait';
  const definitions = {
    wait: ['Espera', 'first', 'Tiempo acumulado en la cola de preparados. En FCFS este proceso solo espera antes de su primer turno.'],
    response: ['Respuesta', 'first', 'Tiempo desde la llegada hasta el primer uso de CPU.'],
    turn: ['Retorno', 'finish', 'Tiempo desde la llegada hasta que termina el proceso.']
  };
  function draw() {
    const job = result.rows.find(item => item.id === selectedId);
    const [label, endKey, explanation] = definitions[displayedMetric];
    const value = job[displayedMetric];
    setPressed(root, '[data-entity]', 'entity', selectedId);
    setPressed(root, '[data-metric]', 'metric', displayedMetric);
    pick(root, '[data-demo]').innerHTML = timeline(result.segments, result.end, { name: 'Ejecución con FCFS', focusId: selectedId });
    pick(root, '[data-job-times]').innerHTML = metric(ms(job.arrival), 'Llega ' + job.id)
      + metric(ms(job.first), 'Empieza ' + job.id) + metric(ms(job.finish), 'Termina ' + job.id);
    pick(root, '[data-value]').innerHTML = metric(`${job[endKey]} − ${job.arrival} = ${ms(value)}`, label + ' de ' + job.id);
    const interval = endKey === 'finish' ? 'termina' : 'empieza';
    const measure = displayedMetric === 'turn' ? 'el retorno' : 'la ' + label.toLowerCase();
    describe(root, explanation, `${job.id} llega en ${job.arrival} y ${interval} en ${job[endKey]}. La diferencia da ${measure}: ${ms(value)}.`);
  }
  pick(root, '[data-metric-jobs]').innerHTML = result.rows.map(job => entityButton(job.id, job.order, job.id === selectedId)).join('');
  useChoice(root, '[data-entity]', 'entity', id => { selectedId = id; draw(); });
  useChoice(root, '[data-metric]', 'metric', key => { displayedMetric = key; draw(); });
  draw();
}

function mountConvoy(root) {
  function draw(order) {
    const result = schedule(order === 'first' ? baseJobs : reversedJobs, 'fcfs');
    setPressed(root, '[data-order]', 'order', order);
    pick(root, '[data-demo]').innerHTML = timeline(result.segments, result.end, { name: 'FCFS y orden de llegada' });
    pick(root, '[data-stats]').innerHTML = metric(ms(result.wait), 'Espera media')
      + metric(ms(result.end), 'Tiempo total')
      + metric(ms(result.rows[2].wait), 'Espera de P3');
    describe(root, order === 'first'
      ? 'P3 llega en el milisegundo 2 y empieza en el 12. P1 y P2 llegaron antes.'
      : 'P2 y P3 llegan antes que P1. El nuevo orden les permite terminar antes.',
      order === 'first'
        ? `P3 pasa ${fmt(result.rows[2].wait)} milisegundos en la cola. Tiene que esperar a que P1 y P2 terminen su trabajo.`
        : `Ahora P3 espera ${fmt(result.rows[2].wait)} milisegundos. Llegó antes que P1, así que recibe su turno en cuanto termina P2.`);
  }
  useChoice(root, '[data-order]', 'order', draw);
  draw('first');
}

function mountShort(root) {
  function draw(mode) {
    const result = schedule(baseJobs, mode);
    const during = result.segments.findIndex(seg => seg.start <= 2 && seg.end > 2);
    setPressed(root, '[data-policy]', 'policy', mode);
    pick(root, '[data-demo]').innerHTML = timeline(result.segments, result.end, { active: during, name: policies[mode] });
    pick(root, '[data-stats]').innerHTML = metric(result.segments[during].label, 'CPU en t = 2')
      + metric(ms(result.rows[2].first), 'Empieza P3')
      + metric(ms(result.wait), 'Espera media');
    describe(root, mode === 'sjf'
      ? 'P1 sigue hasta t = 8. En ese momento, elige P3, cuya ráfaga es de 2 ms.'
      : 'P2 tomó la CPU en t = 1. En t = 2 le quedan 3 ms, así que la llegada de P3, que necesita 2 ms, lo interrumpe.',
      mode === 'sjf'
        ? 'P1 conserva la CPU hasta terminar. SJF elige el trabajo más corto cuando el núcleo queda libre.'
        : 'P3 empieza en el instante 2. Necesita 2 ms y a P2 le quedan 3 ms, por eso SRTF elige P3.');
  }
  useChoice(root, '[data-policy]', 'policy', draw);
  draw('sjf');
}

function mountRR(root) {
  const input = pick(root, '[data-quantum]');
  function draw(value) {
    input.value = value;
    setPressed(root, '[data-set-q]', 'setQ', value);
    const quantum = Number(value);
    const result = schedule(baseJobs, 'rr', quantum);
    pick(root, '[data-demo]').innerHTML = timeline(result.segments, result.end, { name: 'Turnos de Round Robin' });
    pick(root, '[data-stats]').innerHTML = metric(ms(result.response), 'Tiempo medio hasta empezar')
      + metric(result.switches, 'Cambios de proceso');
    describe(root, quantum >= 8
      ? 'Los tres procesos terminan en el primer turno que reciben.'
      : 'P1 usa su primer turno y vuelve al final de la cola.',
      quantum >= 8 ? 'El turno alcanza para que cada proceso termine su trabajo, así que usan la CPU en su orden de llegada.'
        : `P1 necesita 8 milisegundos de CPU. Tras su turno de ${quantum} ms, vuelve al final de la cola con ${8 - quantum} ms de trabajo pendiente.`);
  }
  useChoice(root, '[data-set-q]', 'setQ', draw);
  input.onchange = () => draw(input.value);
  draw(2);
}

function mountAging(root) {
  let aging = false;
  let turns = [];
  let wait = 0;
  let executed = false;
  const step = pick(root, '[data-aging-step]');
  const auto = pick(root, '[data-aging-five]');
  const initialPriority = 5;
  function draw() {
    const effective = aging ? Math.max(1, initialPriority - wait) : initialPriority;
    setPressed(root, '[data-aging]', 'aging', aging ? 'on' : 'off');
    const trace = turns.map((id, i) => chip(`${i + 1}. ${id}`, id === 'P-baja' ? 2 : 0)).join('');
    pick(root, '[data-demo]').innerHTML = `<div class="strip">${trace || '<span class="small">Todavía no se asigna ningún turno.</span>'}</div>`;
    pick(root, '[data-stats]').innerHTML = metric(wait, 'Turnos que esperó P-baja')
      + metric(effective, 'Prioridad efectiva de P-baja')
      + metric(executed ? 'Sí' : 'Aún no', 'P-baja recibió CPU');
    describe(root, executed
      ? 'P-baja alcanzó prioridad 1. Gana el empate por llevar más tiempo esperando.'
      : 'Cada turno llega una tarea nueva de prioridad 1. El número menor representa mayor prioridad.',
      executed ? `P-baja consigue CPU después de ${wait} turnos. Alcanzó la prioridad 1 y gana el empate por haber llegado antes.`
        : `P-baja lleva ${wait} turnos esperando. ${aging ? 'Su prioridad mejora con la espera.' : 'Las tareas de prioridad 1 pasan primero.'}`);
    step.disabled = auto.disabled = executed || turns.length >= 10;
  }
  function turn() {
    if (executed || turns.length >= 10) return;
    executed = aging && initialPriority - wait <= 1;
    turns.push(executed ? 'P-baja' : 'P-alta');
    if (!executed) wait++;
  }
  function reset() {
    turns = [];
    wait = 0;
    executed = false;
    draw();
  }
  useChoice(root, '[data-aging]', 'aging', mode => { aging = mode === 'on'; reset(); });
  step.onclick = () => { turn(); draw(); };
  auto.onclick = () => { for (let i = 0; i < 5; i++) turn(); draw(); };
  pick(root, '[data-reset]').onclick = reset;
  draw();
}

function mountQueues(root) {
  function draw(mode) {
    const strict = mode === 'strict';
    const jobs = Array.from({ length: 8 }, (_, i) => strict || (i + 1) % 4 !== 0 ? 'P1' : 'P2');
    const segments = workSegments(jobs).map(s => ({
      ...s, label: s.id === 'P1' ? 'Alta' : 'Fondo'
    }));
    setPressed(root, '[data-queues]', 'queues', mode);
    pick(root, '[data-demo]').innerHTML = timeline(segments, 8, { units: 'turnos', name: 'Turnos asignados por cola' });
    pick(root, '[data-stats]').innerHTML = metric(strict ? 8 : 6, 'Turnos de la cola alta')
      + metric(strict ? 0 : 2, 'Turnos de la cola de fondo');
    describe(root, strict
      ? 'La cola alta siempre tiene trabajo y ocupa los ocho turnos.'
      : 'De los ocho turnos, seis son para la cola alta y dos para la cola de fondo.',
      strict ? 'La cola alta siempre tiene trabajo. La cola de fondo se queda esperando.'
        : 'La cola de fondo recibe uno de cada cuatro turnos. Las dos colas avanzan.');
  }
  useChoice(root, '[data-queues]', 'queues', draw);
  draw('strict');
}

function mountDeadlines(root) {
  const jobs = [
    { id: 'P1', arrival: 0, burst: 4, priority: 2, deadline: 7 },
    { id: 'P2', arrival: 0, burst: 2, priority: 1, deadline: 3 }
  ];
  function draw(mode) {
    const result = schedule(jobs, mode === 'deadline' ? 'priority' : 'fcfs');
    const rows = result.rows.map(job => {
      const met = job.finish <= job.deadline;
      return `<tr ${met ? '' : 'class="focus-row"'}><td>${job.id}</td><td>${ms(job.burst)}</td>
        <td>${ms(job.deadline)}</td><td>${ms(job.finish)}</td><td>${met ? 'A tiempo' : 'Fuera de plazo'}</td></tr>`;
    }).join('');
    setPressed(root, '[data-deadline]', 'deadline', mode);
    pick(root, '[data-demo]').innerHTML = timeline(result.segments, 7, { name: 'Ejecución con plazos' });
    pick(root, '[data-rows]').innerHTML = rows;
    describe(root, mode === 'deadline'
      ? 'P2 termina en t = 2 y P1 en t = 6. Los dos terminan antes de su plazo.'
      : 'P2 termina en el instante seis. Su plazo era el tres.',
      mode === 'deadline' ? 'P2 va primero y termina en el instante 2. Las dos tareas cumplen sus plazos.'
        : 'P2 termina en el instante 6. Su plazo era el 3, así que termina tarde.');
  }
  useChoice(root, '[data-deadline]', 'deadline', draw);
  draw('fcfs');
}

function mountLab(root) {
  const form = pick(root, '[data-lab-form]');
  const policy = pick(form, '[data-lab-policy]');
  const quantum = pick(form, '[data-lab-quantum]');
  const cost = pick(form, '[data-lab-cost]');
  const rows = pick(form, '[data-job-rows]');
  const add = pick(form, '[data-add-job]');
  const status = pick(root, '[data-lab-status]');
  const decision = pick(root, '[data-lab-decision]');
  const next = pick(root, '[data-lab-next]');
  const finish = pick(root, '[data-lab-finish]');
  const play = pick(root, '[data-lab-play]');
  const rewind = pick(root, '[data-lab-reset]');
  const summary = pick(root, '[data-lab-result]');
  const plot = pick(root, '[data-lab-plot]');
  const choices = pick(root, '[data-lab-jobs]');
  const inspector = pick(root, '[data-inspect-job]');
  const configNote = pick(form, '[data-config-note]');
  let draft = cloneJobs(lab.jobs);
  let selectedId = draft[1]?.id ?? draft[0].id;
  let result;
  let shown = 0;
  let clock = null;
  let dirty = false;
  policy.value = lab.policy;
  quantum.value = lab.quantum;
  cost.value = lab.cost;

  function stop() {
    if (clock !== null) clearInterval(clock);
    clock = null;
    play.textContent = 'Reproducir';
  }

  function drawSelection() {
    setPressed(root, '[data-entity]', 'entity', selectedId);
    picks(rows, '[data-row-job]').forEach(row => {
      row.classList.toggle('focus-row', row.dataset.rowJob === selectedId);
    });
  }

  function drawInspector(visible) {
    const job = result.rows.find(item => item.id === selectedId);
    if (dirty || !job) {
      inspector.innerHTML = `<h3>Proceso ${selectedId}</h3><p>Prepara la simulación para ver los datos actualizados.</p>`;
      setTalk(root, 'Pulsa «Preparar simulación» para aplicar los cambios.');
      return;
    }

    const current = visible.at(-1);
    const time = current?.end ?? 0;
    const slices = visible.filter(segment => segment.id === job.id);
    const done = slices.reduce((sum, segment) => sum + segment.end - segment.start, 0);
    const waiting = Math.max(0, Math.min(time, job.finish) - job.arrival - done);
    const finished = done === job.burst;
    const arrived = time >= job.arrival;
    const state = finished ? 'Terminado'
      : !arrived ? 'Todavía no llega' : current?.id === job.id ? 'Ejecutó el último tramo' : 'En espera de CPU';
    const response = slices.length ? ms(job.response) : '—';
    const intervals = slices.map(segment => `${segment.start}–${segment.end}`).join(' · ');
    const progressLabel = `${job.id} ha ejecutado ${done} de ${job.burst} milisegundos`;
    inspector.innerHTML = `<div class="between"><h3>${chip(job.id, job.order)} ${state}</h3><span class="small">t = ${ms(time)} · llega en ${ms(job.arrival)}</span></div>
      <progress value="${done}" max="${job.burst}" aria-label="${progressLabel}"></progress>
      <div class="dials">
        ${metric(`${done} / ${job.burst} ms`, 'Ejecutado')}
        ${metric(ms(waiting), 'Espera acumulada')}
        ${metric(response, 'Primera respuesta')}
      </div>
      <p class="small">${intervals ? 'Tramos de ' + job.id + ' (ms) · ' + intervals : 'Aún sin tramos ejecutados.'}</p>`;
    if (finished) {
      setTalk(root, `${job.id} termina en el instante ${job.finish}. En total pasa ${job.wait} ms esperando CPU.`);
    } else if (!arrived) {
      setTalk(root, `${job.id} todavía no llega. Se incorpora en el instante ${job.arrival}.`);
    } else {
      setTalk(root, `${job.id} ha usado ${done} de ${job.burst} ms de CPU y acumula ${waiting} ms de espera.`);
    }
  }

  function drawPlayback() {
    const complete = shown === result.segments.length;
    if (complete) stop();
    const current = result.segments[shown - 1];
    pick(root, '[data-lab-count]').textContent = `${shown} / ${result.segments.length} tramos`;
    const visible = result.segments.slice(0, shown);
    plot.innerHTML = timeline(visible, result.end, { active: shown - 1, name: 'Planificación del laboratorio', focusId: selectedId });
    const scroll = pick(plot, '.time-scroll');
    if (current && scroll.scrollWidth > scroll.clientWidth) {
      scroll.scrollLeft = (current.end / result.end) * (scroll.scrollWidth - scroll.clientWidth);
    }
    if (complete) status.textContent = `${policies[lab.policy]} termina en t = ${ms(result.end)}. Hay ${result.switches} cambios entre procesos.`;
    else if (!current) status.textContent = `${policies[lab.policy]} está listo. El reloj empieza en t = 0.`;
    else {
      const action = current.kind === 'work' ? `${current.id} usa la CPU`
        : current.kind === 'switch' ? 'El sistema cambia de contexto' : 'La CPU queda libre';
      status.textContent = `${action} entre t = ${current.start} y t = ${ms(current.end)}.`;
    }
    const rules = {
      fcfs: 'Se elige por orden de llegada entre los procesos listos.',
      sjf: 'Se elige la ráfaga más corta entre los procesos listos al quedar libre la CPU.',
      srtf: 'Se favorece el proceso con menos tiempo de CPU pendiente.',
      rr: `Se toma el frente de la cola y se da un turno de hasta ${ms(lab.quantum)}.`,
      priority: 'Se elige la mejor prioridad al quedar libre la CPU. Un número menor tiene mayor prioridad.',
      priorityP: 'Una prioridad más alta puede interrumpir al proceso en curso.'
    };
    decision.hidden = current?.kind !== 'work' || dirty || complete;
    if (!decision.hidden) decision.textContent = rules[lab.policy];
    next.disabled = finish.disabled = play.disabled = complete || dirty;
    rewind.disabled = shown === 0 || dirty;
    drawSelection();
    drawInspector(visible);
    summary.hidden = !complete || dirty;
    if (!summary.hidden) {
      const wasOpen = pick(summary, 'details')?.open;
      const tableRows = result.rows.map(job => `<tr class="${job.id === selectedId ? 'focus-row' : ''}">
        <td>${job.id}</td><td>${job.finish}</td><td>${job.wait}</td><td>${job.turn}</td><td>${job.response}</td>
        </tr>`).join('');
      summary.innerHTML = `<div class="grid-stats">
        ${metric(ms(result.wait), 'Espera media')}${metric(ms(result.response), 'Respuesta media')}
        ${metric(ms(result.turn), 'Retorno medio')}${metric(`${fmt(result.utilization)}%`, 'Uso útil de CPU')}
        </div><details ${wasOpen ? 'open' : ''}>
          <summary>Ver tiempos por proceso</summary>
          <div class="table-scroll">
            <table><caption>Tiempos en milisegundos</caption>
              <thead><tr><th>Proceso</th><th>Fin</th><th>Espera</th><th>Retorno</th><th>Respuesta</th></tr></thead>
              <tbody>${tableRows}</tbody>
            </table>
          </div>
          <p class="small">Rendimiento · ${fmt(result.throughput)} procesos por ms.</p>
        </details>`;
    }
  }

  function markDirty() {
    stop();
    dirty = true;
    configNote.textContent = 'Hay cambios pendientes. Pulsa «Preparar simulación» para aplicarlos.';
    drawPlayback();
  }

  function drawJobs() {
    const limits = [['arrival', 'Llegada', 0, 40], ['burst', 'Ráfaga', 1, 20], ['priority', 'Prioridad', 1, 9]];
    rows.innerHTML = draft.map((job, i) => `<tr data-row-job="${job.id}">
      <td>${entityButton(job.id, i, job.id === selectedId)}</td>
      ${limits.map(([key, label, min, max]) => `<td><input type="number" min="${min}" max="${max}" step="1"
        value="${Number.isFinite(job[key]) ? job[key] : ''}" data-i="${i}" data-key="${key}"
        aria-label="${label} de ${job.id}" required></td>`).join('')}
      <td><button type="button" class="table-action" aria-label="Quitar ${job.id}"
        data-remove="${i}" ${draft.length <= 1 ? 'disabled' : ''}>Quitar</button></td>
    </tr>`).join('');
    add.disabled = draft.length >= 8;
  }

  function prepare() {
    if (!form.reportValidity()) return;
    stop();
    Object.assign(lab, { jobs: cloneJobs(draft), policy: policy.value, quantum: +quantum.value, cost: +cost.value });
    result = schedule(lab.jobs, lab.policy, lab.quantum, lab.cost);
    if (!lab.jobs.some(job => job.id === selectedId)) selectedId = lab.jobs[0].id;
    choices.innerHTML = result.rows.map(job => entityButton(job.id, job.order, job.id === selectedId)).join('');
    shown = 0;
    dirty = false;
    configNote.textContent = 'Configuración aplicada. El comparador usa estos mismos procesos.';
    drawPlayback();
  }

  form.onsubmit = event => { event.preventDefault(); prepare(); };
  form.addEventListener('input', event => {
    const input = event.target;
    if (input.dataset.key) {
      const job = draft[Number(input.dataset.i)];
      job[input.dataset.key] = input.valueAsNumber;
      selectedId = job.id;
    }
    markDirty();
  });

  function selectFrom(event) {
    const button = event.target.closest('[data-entity]');
    if (!button) return;
    selectedId = button.dataset.entity;
    drawPlayback();
  }
  choices.onclick = selectFrom;
  rows.onclick = event => {
    const button = event.target.closest('[data-remove]');
    if (!button) { selectFrom(event); return; }
    if (draft.length <= 1) return;
    const [removed] = draft.splice(Number(button.dataset.remove), 1);
    if (selectedId === removed.id) selectedId = draft[0].id;
    drawJobs();
    markDirty();
    add.focus();
  };
  add.onclick = () => {
    if (draft.length >= 8) return;
    selectedId = 'P' + lab.nextId++;
    draft.push({ id: selectedId, arrival: 3, burst: 4, priority: 3 });
    drawJobs();
    markDirty();
    rows.lastElementChild.querySelector('input').focus();
  };
  useChoice(form, '[data-preset]', 'preset', preset => {
    draft = cloneJobs(preset === 'idle' ? idleJobs : baseJobs);
    selectedId = draft[1].id;
    policy.value = preset === 'rr' ? 'rr' : 'fcfs';
    quantum.value = 2;
    cost.value = 0;
    lab.nextId = 4;
    drawJobs();
    prepare();
  });

  function advance() {
    if (shown < result.segments.length) shown++;
    drawPlayback();
  }
  next.onclick = advance;
  finish.onclick = () => { shown = result.segments.length; drawPlayback(); };
  rewind.onclick = () => { stop(); shown = 0; drawPlayback(); };
  play.onclick = () => {
    if (clock !== null) { stop(); return; }
    play.textContent = 'Pausar';
    clock = setInterval(advance, 600);
    advance();
  };
  drawJobs();
  prepare();
  return stop;
}

function mountCompare(root) {
  let jobs = cloneJobs(baseJobs);
  let quantum = 2;
  let cost = 0;
  let displayedMetric = 'response';
  let selectedId = 'P2';
  const left = pick(root, '[data-compare-a]');
  const right = pick(root, '[data-compare-b]');
  const processChoices = pick(root, '[data-compare-jobs]');
  left.value = 'fcfs';
  right.value = 'rr';
  const labels = { wait: 'Espera total', response: 'Tiempo hasta empezar', turn: 'Tiempo hasta terminar' };
  const averages = { wait: 'Espera media', response: 'Tiempo medio hasta empezar', turn: 'Tiempo medio hasta terminar' };

  function drawChoices() {
    processChoices.innerHTML = jobs.map((job, i) => entityButton(job.id, i, job.id === selectedId)).join('');
  }

  function draw() {
    const choices = [left.value, right.value];
    const pair = choices.map(policy => schedule(jobs, policy, quantum, cost));
    const end = Math.max(...pair.map(r => r.end));
    const average = selectedId === 'all';
    const values = pair.map(result => average ? result[displayedMetric] : result.rows.find(job => job.id === selectedId)[displayedMetric]);
    const max = Math.max(1, ...values);
    const workload = [jobs.length + (jobs.length === 1 ? ' proceso' : ' procesos')];
    if (choices.includes('rr')) workload.push('Round Robin: hasta ' + ms(quantum) + ' por turno');
    if (cost > 0) workload.push('Coste de cambio: ' + ms(cost));
    pick(root, '[data-compare-use]').textContent = workload.join(' · ');
    pick(root, '[data-compare-plots]').innerHTML = pair.map((r, i) => `<section>
      <div class="between"><h3>${i === 0 ? 'A' : 'B'} · ${policies[choices[i]]}</h3><span class="small">${r.switches} cambios · termina en ${ms(r.end)}</span></div>
      ${timeline(r.segments, end, { compact: true, name: policies[choices[i]], focusId: average ? null : selectedId })}
    </section>`).join('');
    const label = average ? averages[displayedMetric] : labels[displayedMetric] + ' de ' + selectedId;
    pick(root, '[data-compare-caption]').textContent = label;
    pick(root, '[data-compare-bars]').innerHTML = values.map((value, i) => `<div class="measure">
      <span>${i === 0 ? 'A' : 'B'} · ${policies[choices[i]]}</span>
      <span class="measure-track" aria-hidden="true"><i class="tone-${i === 0 ? 0 : 2}" style="width:${100 * value / max}%"></i></span>
      <strong>${ms(value)}</strong>
    </div>`).join('');
    const difference = Math.abs(values[0] - values[1]);
    const better = values[0] < values[1] ? choices[0] : choices[1];
    pick(root, '[data-compare-status]').textContent = difference < 0.00001
      ? 'El tiempo es igual en los dos diagramas.'
      : `${policies[better]} reduce ese tiempo en ${ms(difference)}.`;
    const first = policies[choices[0]];
    const second = policies[choices[1]];
    const verb = displayedMetric === 'response' ? 'tarda en empezar' : displayedMetric === 'turn' ? 'tarda en terminar' : 'espera en total';
    setTalk(root, average
      ? `El promedio es de ${ms(values[0])} con ${first} y ${ms(values[1])} con ${second}.`
      : `${selectedId} ${verb} ${ms(values[0])} con ${first} y ${ms(values[1])} con ${second}.`);
    setPressed(root, '[data-entity]', 'entity', selectedId);
    setPressed(root, '[data-compare-metric]', 'compareMetric', displayedMetric);
  }
  left.onchange = right.onchange = draw;
  processChoices.onclick = event => {
    const button = event.target.closest('[data-entity]');
    if (!button) return;
    selectedId = button.dataset.entity;
    draw();
  };
  useChoice(root, '[data-compare-metric]', 'compareMetric', key => { displayedMetric = key; draw(); });
  pick(root, '[data-compare-average]').onclick = () => { selectedId = 'all'; draw(); };
  function useWorkload(source, newQuantum, newCost) {
    jobs = cloneJobs(source);
    quantum = newQuantum;
    cost = newCost;
    selectedId = jobs[1]?.id ?? jobs[0].id;
    displayedMetric = 'response';
    drawChoices();
    draw();
  }

const editorThreads = {
  H1: { role: 'Interfaz', task: 'atender la escritura', read: 'cargar la configuración del editor' },
  H2: { role: 'Revisión', task: 'revisar el texto', read: 'cargar una entrada del diccionario' }
};
let observedThread = 'H1';

function mountThreadIntro(root) {
  const start = 'Informe sobre sistemas operativos.';
  const additions = [
    'Cada hilo ejecuta su parte del procso.',
    'Podemos revisar una palbra sin salir del editor.',
    'Los hilos trabajan sobre el mismo documento.'
  ];
  const corrections = { procso: 'proceso', palbra: 'palabra' };
  const write = pick(root, '[data-editor-write]');
  const review = pick(root, '[data-editor-review]');
  const page = pick(root, '[data-editor-lines]');
  let lines = [start];
  let checked = 0;
  let lastAction = null;

  function draw() {
    const found = [];
    page.innerHTML = lines.map((line, i) => {
      const text = i < checked ? line.replace(/\b(procso|palbra)\b/g, word => {
        found.push(word);
        return `<mark class="editor-flag" title="Sugerencia: ${corrections[word]}">${word}</mark>`;
      }) : line;
      return `<li>${text}</li>`;
    }).join('');
    write.disabled = lines.length - 1 >= additions.length;
    review.disabled = checked === lines.length;
    write.classList.toggle('primary', checked === lines.length || !lastAction);
    review.classList.toggle('primary', checked < lines.length && lastAction === 'write');
    if (!lastAction) {
      describe(root, 'El editor ya tiene una línea.',
        'P1 es el proceso del editor. Su memoria guarda el texto que usan los dos hilos.');
    } else if (lastAction === 'write') {
      describe(root, `H1 añadió la línea ${lines.length}.`,
        'H1 acaba de guardar una línea en la memoria del editor. H2 puede leerla y revisar su ortografía.');
    } else {
      const suggestions = found.map(word => '«' + word + '» → «' + corrections[word] + '»').join(' · ');
      describe(root, suggestions ? 'H2 encontró ' + (found.length === 1 ? 'una marca' : found.length + ' marcas') + ' · ' + suggestions : 'H2 revisó el texto y no encontró marcas.',
        suggestions
          ? 'H2 revisó el texto que escribió H1. Las palabras resaltadas muestran las faltas que encontró.'
          : 'H2 revisó el texto compartido. La revisión terminó con cero palabras marcadas.');
    }
  }
  write.onclick = () => {
    if (write.disabled) return;
    lines.push(additions[lines.length - 1]);
    observedThread = 'H1';
    lastAction = 'write';
    draw();
  };
  review.onclick = () => {
    if (review.disabled) return;
    checked = lines.length;
    observedThread = 'H2';
    lastAction = 'review';
    draw();
  };
  pick(root, '[data-editor-reset]').onclick = () => {
    lines = [start];
    checked = 0;
    observedThread = 'H1';
    lastAction = null;
    draw();
  };
  draw();
}

      { state: 'En CPU', cpu: id, reason: 'Recibe un turno', action: io ? 'Pedir lectura' : 'Agotar turno', text: `El planificador asigna el núcleo a ${id}.`, talk: `${id} recibe la CPU para ${thread.task}.` },
      ...(io ? [

          <small>Paso ${i + 1}</small><b>${item.state}</b>

function mountThreadWork(root) {
  let threads = 3;
  let turn = 0;
  let work = [];
  let onCores = [];
  let cursor = 0;
  let selected = 1;
  const blocked = new Set();
  const coresField = pick(root, '[data-cores]');
  const options = pick(root, '[data-work-options]');
  const choices = pick(root, '[data-work-threads]');
  const block = pick(root, '[data-thread-block]');
  const add = pick(root, '[data-thread-add]');
  const remove = pick(root, '[data-thread-remove]');
  const step = pick(root, '[data-work-step]');
  const finish = pick(root, '[data-work-finish]');
  const total = 12;

  function drawChoices() {
    choices.innerHTML = Array.from({ length: threads }, (_, i) => entityButton('H' + (i + 1), i, i + 1 === selected)).join('');
  }

  function draw() {
    const cores = +coresField.value;
    setPressed(root, '[data-work-case]', 'workCase', threads + ':' + cores);
    const parallel = Math.min(threads - blocked.size, cores);
    const complete = work.length === total;
    const expected = complete ? turn : parallel ? turn + Math.ceil((total - work.length) / parallel) : '—';
    const selectedId = 'H' + selected;
    const contribution = work.filter(id => id === selected).length;
    const waiting = blocked.has(selected);
    setPressed(root, '[data-entity]', 'entity', selectedId);
    const onLastCore = onCores.indexOf(selected) + 1;
    const last = onLastCore ? ` · Núcleo ${onLastCore} en el último turno` : '';
    pick(root, '[data-thread-state]').textContent = `${selectedId} · ${waiting ? 'Bloqueado por E/S' : 'Disponible'} · ${contribution} ${contribution === 1 ? 'unidad hecha' : 'unidades hechas'}${last}`;
    block.textContent = `${waiting ? 'Reanudar' : 'Bloquear'} ${selectedId}`;
    block.disabled = complete;
    pick(root, '[data-work]').innerHTML = Array.from({ length: total }, (_, i) => {
      const id = work[i];
      const css = id ? 'tone-' + (id - 1) : 'pending';
      const focus = options.open ? id === selected ? 'focused-unit' : id ? 'dimmed-unit' : '' : '';
      return `<span class="${css} ${focus}" title="Unidad ${i + 1}${id ? ' completada por H' + id : ' pendiente'}">${id ? 'H' + id : i + 1}</span>`;
    }).join('');
    pick(root, '[data-core-map]').innerHTML = Array.from({ length: cores }, (_, i) => {
      const id = onCores[i];
      return `<div class="flow-cell ${id ? 'active' : ''} ${options.open && id === selected ? 'core-focus' : ''}"><strong>Núcleo ${i + 1}</strong>
        <span>${id ? 'H' + id + ' en el último turno' : 'Libre'}</span></div>`;
    }).join('');
    pick(root, '[data-stats]').innerHTML = metric(`${work.length} / ${total}`, 'Unidades completas')
      + metric(turn, 'Turnos usados') + metric(expected, 'Turnos previstos');
    const capacity = parallel === 1 ? 'Una unidad por turno.' : `Hasta ${parallel} unidades por turno.`;
    if (complete) {
      describe(root, `Las 12 unidades se completaron en ${turn} turnos.`,
        `El trabajo completo tomó ${turn} ${turn === 1 ? 'turno' : 'turnos'}.`);
    } else if (!parallel) {
      describe(root, 'Todos los hilos esperan E/S. Reanuda uno para continuar.',
        'El trabajo se detiene porque todos los hilos están bloqueados.');
    } else if (waiting) {
      describe(root, `${selectedId} espera E/S. ${capacity}`,
        `${selectedId} está bloqueado. El trabajo continúa con los hilos que están listos.`);
    } else if (!turn) {
      const explanation = cores === 1 && threads > 1
        ? 'Los hilos se reparten los turnos de un solo núcleo. En cada turno se llena una casilla de trabajo.'
        : parallel === 1 ? 'Un hilo completa una casilla de trabajo por turno.' : `${parallel} hilos pueden trabajar al mismo tiempo, uno en cada núcleo. A eso se le llama paralelismo.`;
      describe(root, capacity, explanation);
    } else {
      describe(root, `Turno ${turn}. Se completaron ${onCores.length} ${onCores.length === 1 ? 'unidad' : 'unidades'}. Quedan ${total - work.length}.`,
        onCores.length === 1 ? 'En este turno trabajó un núcleo y se llenó una casilla.' : `Trabajaron ${onCores.length} núcleos al mismo tiempo. Cada uno completó una casilla en este turno.`);
    }
    add.disabled = threads >= 6;
    remove.disabled = threads <= 1;
    step.disabled = finish.disabled = complete || parallel === 0;
  }
  function reset() { work = []; onCores = []; turn = 0; cursor = 0; draw(); }
  function advance() {
    const ready = Array.from({ length: threads }, (_, i) => (cursor + i) % threads + 1)
      .filter(id => !blocked.has(id));
    onCores = ready.slice(0, Math.min(+coresField.value, total - work.length));
    if (!onCores.length) return false;
    cursor = onCores.at(-1) % threads;
    work.push(...onCores);
    turn++;
    return true;
  }
  choices.onclick = event => {
    const button = event.target.closest('[data-entity]');
    if (!button) return;
    selected = Number(button.dataset.entity.slice(1));
    draw();
  };
  block.onclick = () => {
    if (blocked.has(selected)) blocked.delete(selected);
    else blocked.add(selected);
    draw();
  };
  add.onclick = () => {
    if (threads >= 6) return;
    selected = ++threads;
    drawChoices();
    reset();
  };
  remove.onclick = () => {
    if (threads <= 1) return;
    blocked.delete(threads--);
    selected = Math.min(selected, threads);
    drawChoices();
    reset();
  };
  coresField.onchange = reset;
  step.onclick = () => { advance(); draw(); };
  finish.onclick = () => {
    while (work.length < total) {
      if (!advance()) break;
    }
    draw();
  };
  pick(root, '[data-reset]').onclick = reset;
  function loadScenario(value) {
    const [threadCount, cores] = value.split(':').map(Number);
    threads = threadCount;
    selected = 1;
    coresField.value = cores;
    blocked.clear();
    drawChoices();
    reset();
  }
  pick(root, '[data-default]').onclick = () => loadScenario('3:1');
  useChoice(root, '[data-work-case]', 'workCase', loadScenario);
  options.addEventListener('toggle', draw);
  drawChoices();
  draw();
}

const diagramThreadLimit = 6;
const newDiagramThread = () => ({ instruction: 0 });
const processDiagram = { threads: [newDiagramThread(), newDiagramThread()], active: 0, lastAddedCount: null };
const programLines = ['Leer un bloque', 'Procesar los datos', 'Guardar el resultado'];
const threadName = index => 'H' + (index + 1);

const processRegions = {
  files: { name: 'Archivos', explanation: 'Los hilos pueden leer o escribir los archivos que el proceso tiene abiertos, como el documento del editor.' },
  data: { name: 'Datos', explanation: 'Los datos son los valores que usa el programa. Por ejemplo, dos hilos del editor pueden leer el mismo texto guardado.' },
  code: { name: 'Código', explanation: 'El código son las instrucciones del programa. Los hilos usan ese mismo código y cada uno guarda en qué instrucción va.' }
};

function addDiagramThread() {
  if (processDiagram.threads.length < diagramThreadLimit) {
    processDiagram.active = processDiagram.threads.push(newDiagramThread()) - 1;
    processDiagram.lastAddedCount = processDiagram.threads.length;
  }
}

function removeDiagramThread() {
  if (processDiagram.threads.length > 1) processDiagram.threads.pop();
  processDiagram.active = Math.min(processDiagram.active, processDiagram.threads.length - 1);
  processDiagram.lastAddedCount = null;
}

function mountProcessAnatomy(root) {
  const diagram = pick(root, '[data-process-diagram]');
  const title = pick(root, '[data-anatomy-title]');
  const advance = pick(root, '[data-anatomy-advance]');
  const add = pick(root, '[data-anatomy-add]');
  const remove = pick(root, '[data-anatomy-remove]');
  const reference = newDiagramThread();
  let selected = { part: 'stack', index: processDiagram.active };

  function partButton(process, part, index, label, accessibleLabel = label) {
    if (process === 'mono') return `<span class="process-part-reference">${label}</span>`;
    const pressed = part === selected.part && index === selected.index;
    return `<button type="button" class="process-part" data-anatomy-part="${part}|${index}"
      aria-label="${accessibleLabel}" aria-pressed="${pressed}">${label}</button>`;
  }

  function processBox(process, threads) {
    const mono = process === 'mono';
    const name = mono ? 'P1' : 'P2';
    const resources = Object.entries(processRegions).map(([key, resource]) =>
      partButton(process, key, -1, resource.name, resource.name + ' de ' + name)).join('');
    const contexts = threads.map((_, index) => {
      const id = threadName(index);
      const active = !mono && index === selected.index;
      return `<div class="thread-envelope ${active ? 'thread-observed' : ''}">
        <strong>${id} · ${index === 0 ? 'Hilo principal' : 'Hilo adicional'}</strong>
        <div class="thread-parts">
          ${partButton(process, 'stack', index, 'Pila', 'Pila de ' + id + ' en ' + name)}
          ${partButton(process, 'registers', index, 'Registros', 'Registros de ' + id + ' en ' + name)}
        </div>
      </div>`;
    }).join('');
    const kind = threads.length === 1 ? 'Monohilo' : 'Multihilo';
    return `<section class="process-envelope" aria-label="${name} · ${kind}">
      <div class="between process-heading"><h3>Proceso ${name} · ${kind}</h3>
        <span class="small">${threads.length} ${threads.length === 1 ? 'hilo' : 'hilos'}${mono ? ' · referencia' : ''}</span></div>
      <div class="process-resources" role="group" aria-label="Recursos de ${name}">${resources}</div>
      <div class="thread-envelopes ${threads.length > 3 ? 'many' : ''}">${contexts}</div>
    </section>`;
  }

  function draw(added = false) {
    diagram.innerHTML = processBox('mono', [reference]) + processBox('multi', processDiagram.threads);
    add.disabled = processDiagram.threads.length >= diagramThreadLimit;
    remove.disabled = processDiagram.threads.length <= 1;
    const resource = processRegions[selected.part];
    if (resource) {
      title.textContent = resource.name + ' de P2';
      advance.hidden = true;
      describe(root, 'Recurso compartido.', resource.explanation);
      return;
    }

    const id = threadName(selected.index);
    const thread = processDiagram.threads[selected.index];
    const finished = thread.instruction === programLines.length;
    const following = finished ? 'tarea terminada' : programLines[thread.instruction].toLowerCase();
    const stack = selected.part === 'stack';
    title.textContent = `${stack ? 'Pila' : 'Registros'} de ${id} en P2`;
    advance.hidden = false;
    advance.disabled = finished;
    advance.textContent = 'Avanzar ' + id;
    if (stack) {
      describe(root, added ? 'Nuevo hilo en P2.' : 'Pila propia del hilo.', added
        ? `${id} aparece con su propia pila para guardar datos temporales y con sus propios valores de registros. El código, los datos comunes y los archivos son del proceso completo.`
        : `La pila de ${id} es donde ese hilo guarda datos temporales, como los valores de un cálculo. Cada hilo tiene una pila para su trabajo.`);
    } else {
      describe(root, `Instrucciones hechas: ${thread.instruction}. Siguiente: ${following}.`,
        `Los registros son espacios pequeños y rápidos del procesador. El sistema guarda sus valores para que ${id} pueda continuar desde la próxima instrucción.`);
    }
  }

  diagram.onclick = event => {
    const button = event.target.closest('[data-anatomy-part]');
    if (!button) return;
    const key = button.dataset.anatomyPart;
    const [part, index] = key.split('|');
    selected = { part, index: Number(index) };
    if (selected.index >= 0) processDiagram.active = selected.index;
    draw();
    pick(diagram, '[aria-pressed="true"]')?.focus({ preventScroll: true });
  };
  add.onclick = () => {
    addDiagramThread();
    selected = { part: 'stack', index: processDiagram.active };
    draw(true);
  };
  remove.onclick = () => {
    removeDiagramThread();
    selected = { part: 'stack', index: processDiagram.active };
    draw();
  };
  advance.onclick = () => {
    const thread = processDiagram.threads[selected.index];
    if (!thread || thread.instruction >= programLines.length) return;
    thread.instruction++;
    selected.part = 'registers';
    draw();
  };
  pick(root, '[data-anatomy-reset]').onclick = () => {
    processDiagram.threads = [newDiagramThread(), newDiagramThread()];
    processDiagram.active = 0;
    processDiagram.lastAddedCount = null;
    selected = { part: 'stack', index: 0 };
    draw();
  };
  draw();
}

function mountThreadMemory(root) {
  const diagram = pick(root, '[data-address-map]');
  const moments = pick(root, '[data-memory-moments]');
  const toggle = pick(root, '[data-memory-toggle]');

  const currentCount = processDiagram.threads.length;
  const replayLastAddition = currentCount === processDiagram.lastAddedCount || currentCount === diagramThreadLimit;
  const beforeCount = replayLastAddition ? currentCount - 1 : currentCount;
  const afterCount = beforeCount + 1;
  const newThread = threadName(beforeCount);
  let after = false;

  function moment(label, count, active) {
    const totals = count === 1 ? '1 hilo · 1 pila' : `${count} hilos · ${count} pilas`;
    return `<div class="memory-moment" aria-current="${active ? 'step' : 'false'}">
      <span>${label}</span><strong>${totals}</strong>
    </div>`;
  }

  function draw() {
